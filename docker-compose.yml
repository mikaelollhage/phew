services:
  phew:
    image: phew:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phew
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Storage__DataPath=/app/data
      - Security__EnableHttpsRedirection=false
      - TZ=Europe/Stockholm
      - Push__Vapid__Subject=${VAPID_SUBJECT:-mailto:noreply@phew.local}
    volumes:
      # Persistent volume for SQLite database (phew.db), images, and DataProtection keys
      - phew-data:/app/data
    healthcheck:
      test: ["CMD", "dotnet", "Phew.Web.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  phew-data:
    name: phew-data


